name: Tenkiame CI-CD
on:
  push:
    branches:
    - ci-cd-dev

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    env:
      dockerfile: ${{ vars.MAIN_CONTEXT_DIR}}/Dockerfile
      image: hub.docker.com/repositories/${{ vars.DOCKERHUB_USERNAME }}/tenkiame
      tag: ${{ vars.DOCKERHUB_USERNAME }}/tenkiame:latest
      build_context: ${{ vars.MAIN_CONTEXT_DIR}}
    
    # Repo files permissions
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Tenkiame's Docker images
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.build_context }}
          file: ${{ env.dockerfile }}
          push: true
          tags: ${{ env.tag }}
          
  ssh-and-deploy-containers:
    needs: build-and-push-image #Make the jobs run in sequence
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: "${{ vars.MAIN_CONTEXT_DIR }}"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update .env
        run: |
          touch -m ./.env
          echo ${{ secrets.METS_SECRET_NAME }}=${{ secrets.METS_SECRET_VALUE }} > ./.env
          echo ${{ secrets.NW_SECRET_NAME }}=${{ secrets.NW_SECRET_VALUE }} >> ./.env

      - name: ls 
        run: ls -al  

      - name: Copy files via SCP
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.HOST_USERNAME }}
          key: ${{ secrets.HOST_KEY }}
          port: ${{ secrets.PORT }}
          source: ".env"
          target: "${{ secrets.TENKIAME_DIR }}"


      - name: Deploy new container via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.HOST_USERNAME }}
          key: ${{ secrets.HOST_KEY }}
          port: ${{ secrets.HOST_PORT }}
          script: |
            docker compose -f ${{ secrets.TENKIAME_DIR}}/tenkiame-docker-compose.yml pull
            docker compose -f ${{ secrets.TENKIAME_DIR}}/tenkiame-docker-compose.yml up -d